# Pre-commit hooks. Install once per clone: `pre-commit install`
# The secret scan and basic hygiene hooks are shared by every project.
# Add the formatter/linter hooks for this project's chosen tools below.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]

  # --- Project-specific formatter / linter hooks (uncomment what applies) ---
  # Python (Ruff):
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.7.4
  #   hooks:
  #     - id: ruff
  #       args: [--fix]
  #     - id: ruff-format
  #
  # JavaScript/TypeScript (Prettier via local install):
